name: Manual deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Placeholder: add the Azure login step here
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Placeholder: Confirm identity can see resource group
      # - run: az group show --name ${{ secrets.MY_RESOURCE_GROUP }}

      # Build and deploy a Container App from Dockerfile
      - name: Build and deploy Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          location: australiaeast
          appSourcePath: ${{ github.workspace }}/20261023/next-match
          acrName: ${{ secrets.MY_ACRNAME }}
          containerAppName: ${{ secrets.NEXT_MATCH_CONTAINERAPP_NAME }}
          containerAppEnvironment: ${{ secrets.NEXT_MATCH_CONTAINERAPP_ENV }}
          targetPort: 3000
          resourceGroup: ${{ secrets.MY_RESOURCE_GROUP }}