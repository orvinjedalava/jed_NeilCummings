name: Carsties Provision PostgreSQL
on:
  workflow_dispatch:
    inputs:
      admin_user:
        description: PostgreSQL admin username (letters and numbers only, starting with a letter)
        required: true
        default: carstiesadminuser
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep
        shell: bash
        env:
          RG: ${{ secrets.MY_RESOURCE_GROUP }}
          PG_SERVER_NAME: ${{ vars.PG_SERVER_NAME }}
          PG_ADMIN_USER: ${{ inputs.admin_user }}
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
          MY_IP: ${{ vars.MY_IP }}
        run: |
          set -euo pipefail
          if [[ ! "$PG_ADMIN_USER" =~ ^[a-zA-Z][a-zA-Z0-9]{0,62}$ ]]; then
            echo "::error::PostgreSQL admin username must be 1-63 letters and numbers, starting with a letter."
            exit 1
          fi
          az deployment group create \
            --resource-group "$RG" \
            --template-file 20261027/infra/postgres.bicep \
            --parameters serverName="$PG_SERVER_NAME" \
                         adminUser="$PG_ADMIN_USER" \
                         adminPassword="$PG_ADMIN_PASSWORD" \
                         myIp="$MY_IP"