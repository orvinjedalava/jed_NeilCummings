name: Carsties - Deploy - AuctionService
on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image in ACR
        shell: bash
        env:
          ACR_NAME: ${{ vars.CONTAINER_REGISTRY }}
        run: |
          set -euo pipefail
          az acr build \
            --registry "$ACR_NAME" \
            --image "auctionservice:${{ github.sha }}" \
            --file 20261027/Carsties/src/AuctionService/Dockerfile \
            20261027/Carsties/src

      - name: Deploy to Container App
        shell: bash
        env:
          RG: ${{ secrets.MY_RESOURCE_GROUP }}
          ACR_NAME: ${{ vars.CONTAINER_REGISTRY }}
          APP_NAME: ${{ vars.CONTAINERAPP_AUCTIONSERVICE }}
          PG_SERVER_NAME: ${{ vars.PG_SERVER_NAME }}
          PG_ADMIN_USER: ${{ secrets.PG_ADMIN_USER }}
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
          RABBITMQ_APP: ${{ vars.CONTAINERAPP_RABBITMQ }}
          RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          IDENTITY_APP: ${{ vars.CONTAINERAPP_IDENTITYSERVICE }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PG_ADMIN_PASSWORD"
          echo "::add-mask::$RABBITMQ_PASSWORD"

          # Azure PostgreSQL rejects non-TLS connections, so SSL Mode=Require is mandatory
          CONN="Host=${PG_SERVER_NAME}.postgres.database.azure.com;Port=5432;Database=auctions;Username=${PG_ADMIN_USER};Password=${PG_ADMIN_PASSWORD};SSL Mode=Require"

          # Store the connection string and rabbit pass as Container App secrets, not a plain env var
          az containerapp secret set \
            --name "$APP_NAME" --resource-group "$RG" \
            --secrets db-connection="$CONN" \
                      rabbit-pass="$RABBITMQ_PASSWORD"

          # Look up IdentityService's public hostname (no scheme) from its ingress config.
          # Used to build IdentityServiceUrl so the JWT issuer matches the one IdentityService advertises
          IDENTITY_FQDN=$(az containerapp show --name "$IDENTITY_APP" --resource-group "$RG" \
                  --query properties.configuration.ingress.fqdn -o tsv)

          # Creates a new revision with the new image; env var reads the secret
          az containerapp update \
            --name "$APP_NAME" --resource-group "$RG" \
            --image "${ACR_NAME}.azurecr.io/auctionservice:${{ github.sha }}" \
            --set-env-vars \
              ConnectionStrings__DefaultConnection=secretref:db-connection \
              RabbitMQ__Host="$RABBITMQ_APP" \
              RabbitMQ__Username="$RABBITMQ_USER" \
              RabbitMQ__Password=secretref:rabbit-pass \
              IdentityServiceUrl="https://${IDENTITY_FQDN}"