name: Carsties - Deploy - IdentityService
on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image in ACR
        shell: bash
        env:
          ACR_NAME: ${{ vars.CONTAINER_REGISTRY }}
        run: |
          set -euo pipefail
          az acr build \
            --registry "$ACR_NAME" \
            --image "identityservice:${{ github.sha }}" \
            --file 20261027/Carsties/src/IdentityService/Dockerfile \
            20261027/Carsties/src

      - name: Deploy to Container App
        shell: bash
        env:
          RG: ${{ secrets.MY_RESOURCE_GROUP }}
          ACR_NAME: ${{ vars.CONTAINER_REGISTRY }}
          APP_NAME: ${{ vars.CONTAINERAPP_IDENTITYSERVICE }}
          PG_SERVER_NAME: ${{ vars.PG_SERVER_NAME }}
          PG_ADMIN_USER: ${{ secrets.PG_ADMIN_USER }}
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::add-mask::$PG_ADMIN_PASSWORD"

          CONN="Server=${PG_SERVER_NAME}.postgres.database.azure.com;Port=5432;Database=identity;User Id=${PG_ADMIN_USER};Password=${PG_ADMIN_PASSWORD};SSL Mode=Require"

          # Public URL of this app; becomes the token issuer
          FQDN=$(az containerapp show --name "$APP_NAME" --resource-group "$RG" \
                   --query properties.configuration.ingress.fqdn -o tsv)

          az containerapp secret set \
            --name "$APP_NAME" --resource-group "$RG" \
            --secrets db-connection="$CONN"

          az containerapp update \
            --name "$APP_NAME" --resource-group "$RG" \
            --image "${ACR_NAME}.azurecr.io/identityservice:${{ github.sha }}" \
            --set-env-vars \
              ConnectionStrings__DefaultConnection=secretref:db-connection \
              IssuerUri="https://${FQDN}" \
              ASPNETCORE_FORWARDEDHEADERS_ENABLED=true