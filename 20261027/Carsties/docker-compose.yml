services:
  postgres:
    image: postgres:18
    environment:
      # Creates this superuser and password on first startup only
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespw
    ports:
      # host:container; lets tools on your machine (IDE, pgAdmin) reach the DB
      - "5432:5432"
    volumes:
      # Named volume so data survives container recreation
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # Marks the container healthy only once Postgres accepts connections
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:latest
    environment:
      # admin API key value prompted when browsing meilisearch url
      MEILI_MASTER_KEY: masterkey
    ports:
      # host 7700 -> container 7700 (the port set by Meilisearch)
      - "7700:7700"
    volumes:
      # Named volume so data survives container recreation
      - meilisearch_data:/meili_data

  rabbitmq:
    # image comes with user interface to check and manage our queues
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      # host 5672 -> container 5672
      - "5672:5672"
      # host 15672 -> container 15672 ( for web interface )
      - "15672:15672"
    volumes:
      # persistent storage for durability of messages
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  identity-service:
    build:
      context: ./src
      dockerfile: IdentityService/Dockerfile
    ports:
      # host 5001 -> container 8080 (5001 matches launchSettings.json)
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # "postgres" is the compose service name, not localhost
      ConnectionStrings__DefaultConnection: "Server=postgres:5432;User Id=postgres;Password=postgrespw;Database=identity"
      IssuerUri: "http://localhost:5001"
    depends_on:
      postgres:
        # SeedData.EnsureSeedData runs Database.Migrate() on startup, so the DB must accept connections
        condition: service_healthy 

  auction-service:
    build:
      # Folder containing the Dockerfile; compose builds the image from it
      context: ./src
      dockerfile: AuctionService/Dockerfile
    ports:
      # host 7001 -> container 8080 (the port set by ASPNETCORE_HTTP_PORTS)
      - "7001:8080"
    environment:
      # Needed so appsettings.Development.json is loaded (unless excluded by .dockerignore)
      ASPNETCORE_ENVIRONMENT: Development
      # Overrides ConnectionStrings:DefaultConnection; "postgres" is the service name, not localhost
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=auctions;Username=postgres;Password=postgrespw"
      RabbitMQ__Host: "rabbitmq"
      IdentityServiceUrl: "http://identity-service:8080"
    depends_on:
      postgres:
        # Wait for the healthcheck to pass, not just for the container to start
        condition: service_healthy
      rabbitmq:
        condition: service_started
  
  search-service:
    build:
      context: ./src
      dockerfile: SearchService/Dockerfile
    ports:
      # host 7002 -> container 8080
      - "7002:8080"
    environment:
      # "meilisearch", "auction-service" and "rabbitmq" are compose service names, not localhost
      Meilisearch__Url: "http://meilisearch:7700"
      Meilisearch__ApiKey: "masterkey"
      AuctionSvcUrl: "http://auction-service:8080"
      RabbitMQ__Host: "rabbitmq"
    depends_on:
      meilisearch:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      auction-service:
        condition: service_started

  gateway-service:
    build:
      context: ./src
      dockerfile: GatewayService/Dockerfile
    ports:
      # host 6001 -> container 8080 (6001 matches launchSettings.json)
      - "6001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      IdentityServiceUrl: "http://identity-service:8080"
      ReverseProxy__Routes__auctionsRead__ClusterId: "auctions"
      ReverseProxy__Routes__auctionsRead__Match__Path: "/auctions/{**catch-all}"
      ReverseProxy__Routes__auctionsRead__Match__Methods__0: "GET"
      ReverseProxy__Routes__auctionsRead__Transforms__0__PathPattern: "api/auctions/{**catch-all}"
      ReverseProxy__Routes__auctionsWrite__ClusterId: "auctions"
      ReverseProxy__Routes__auctionsWrite__AuthorizationPolicy: "default"
      ReverseProxy__Routes__auctionsWrite__Match__Path: "/auctions/{**catch-all}"
      ReverseProxy__Routes__auctionsWrite__Match__Methods__0: "POST"
      ReverseProxy__Routes__auctionsWrite__Match__Methods__1: "PUT"
      ReverseProxy__Routes__auctionsWrite__Match__Methods__2: "DELETE"
      ReverseProxy__Routes__auctionsWrite__Transforms__0__PathPattern: "api/auctions/{**catch-all}"
      ReverseProxy__Routes__search__ClusterId: "search"
      ReverseProxy__Routes__search__Match__Path: "/search/{**catch-all}"
      ReverseProxy__Routes__search__Transforms__0__PathPattern: "api/search/{**catch-all}"
      ReverseProxy__Clusters__auctions__Destinations__auctionsApi__Address: "http://auction-service:8080"
      ReverseProxy__Clusters__search__Destinations__searchApi__Address: "http://search-service:8080"
    depends_on:
      - identity-service
      - auction-service
      - search-service

# Declares the named volume used by postgres
volumes:
  postgres_data:
  meilisearch_data:
  rabbitmq_data: